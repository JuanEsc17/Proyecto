<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Formulario de contacto para Recetario Casero. Envíanos tus dudas, sugerencias o propuestas.">
  <title>Contacto | Recetario Casero</title>
  <link rel="stylesheet" href="estilosIA.css">
</head>
<body>
  <!-- NAVEGACIÓN -->
  <nav class="navbar" role="navigation" aria-label="Navegación principal">
    <div class="nav-container">
      <a href="index.html" class="nav-logo" aria-label="Recetario Casero - Inicio">🍳 Recetario Casero</a>

      <input type="checkbox" id="nav-toggle" class="nav-toggle">
      <label for="nav-toggle" class="nav-toggle-label" aria-label="Abrir menú de navegación">
        <span class="hamburger"></span>
      </label>

      <ul class="nav-menu" role="menubar">
        <li role="none"><a href="index.html" class="nav-link" role="menuitem">Catálogo</a></li>
        <li role="none"><a href="contacto.html" class="nav-link nav-link--active" role="menuitem" aria-current="page">Contacto</a></li>
        <li role="none"><a href="quien-mantiene.html" class="nav-link" role="menuitem">Quién mantiene</a></li>
      </ul>
    </div>
  </nav>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="main-content" role="main">
    <header class="page-header">
      <h1 class="page-title">Contacto</h1>
      <p class="page-subtitle">¿Tienes alguna duda, sugerencia o quieres proponer una receta? Escríbenos.</p>
    </header>

    <form class="contact-form" action="mailto:recetariocasero@ejemplo.com" method="POST" enctype="text/plain">
      <div class="form-group">
        <label for="nombre" class="form-label">Nombre <span aria-hidden="true">*</span></label>
        <input type="text" id="nombre" name="nombre" class="form-input" required aria-required="true" autocomplete="name">
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email <span aria-hidden="true">*</span></label>
        <input type="email" id="email" name="email" class="form-input" required aria-required="true" autocomplete="email">
      </div>

      <div class="form-group">
        <label for="mensaje" class="form-label">Mensaje <span aria-hidden="true">*</span></label>
        <textarea id="mensaje" name="mensaje" class="form-textarea" required aria-required="true" placeholder="Cuéntanos qué necesitas..."></textarea>
      </div>

      <button type="submit" class="form-submit">Enviar mensaje</button>
    </form>
  </main>

  <!-- FOOTER -->
  <footer class="footer" role="contentinfo">
    <div class="footer-content">
      <p>&copy; 2026 Recetario Casero. Hecho con ❤️ para compartir cocina de verdad.</p>
      <nav class="footer-links" aria-label="Enlaces del pie de página">
        <a href="index.html" class="footer-link">Catálogo</a>
        <a href="contacto.html" class="footer-link">Contacto</a>
        <a href="quien-mantiene.html" class="footer-link">Quién mantiene</a>
      </nav>
    </div>
  </footer>
</body>
</html>
